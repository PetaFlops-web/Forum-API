name: Continuous Integration

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: ['20', '22']

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: mysecretpassword
                    POSTGRES_DB: forumapi_test
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
            - name: Install dependencies
              run: npm ci
            - name: Run migrations
              run: npm run migrate up
              env:
                  DATABASE_URL: postgres://postgres:mysecretpassword@localhost:5432/forumapi_test
            - name: Run tests
              run: npm test
              env:
                  CI: true
                  NODE_ENV: test
                  PORT: 3000
                  PGHOST: localhost
                  PGPORT: 5432
                  PGUSER: postgres
                  PGPASSWORD: mysecretpassword
                  PGDATABASE: forumapi_test
                  ACCESS_TOKEN_KEY: ci_secret_access_key
                  REFRESH_TOKEN_KEY: ci_secret_refresh_key
                  ACCESS_TOKEN_AGE: 3600
            - name: Run lint
              run: npm run lint
