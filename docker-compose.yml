services:

  postgres:
    image: postgres:16-alpine
    container_name: forum-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-forumuser}
      POSTGRES_PASSWORD: ${PGPASSWORD:-forumpassword}
      POSTGRES_DB: ${PGDATABASE:-forum_api}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-forumuser} -d ${PGDATABASE:-forum_api}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - forum-network
      
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: forum-api-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-forumuser}
      PGPASSWORD: ${PGPASSWORD:-forumpassword}
      PGDATABASE: ${PGDATABASE:-forum_api}
      ACCESS_TOKEN_KEY: ${ACCESS_TOKEN_KEY:-super_secret_access_token_key}
      REFRESH_TOKEN_KEY: ${REFRESH_TOKEN_KEY:-super_secret_refresh_token_key}
      ACCESS_TOKEN_AGE: ${ACCESS_TOKEN_AGE:-1800}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - forum-network

  nginx:
    image: nginx:alpine
    container_name: forum-api-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      # - "443:443"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - forum-network

volumes:
  postgres_data:
    driver: local

networks:
  forum-network:
    driver: bridge
